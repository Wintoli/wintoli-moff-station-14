- type: entity
  parent: [ BaseMagicalContraband, ClothingOuterArmorBaseCarapace ]
  id: ClothingOuterArmorWizard
  name: wizard's breastplate
  description: An enchanted breastplate for use by arcane troublemakers looking to be able to take a beating.
  components:
  - type: Sprite
    sprite: _Moffstation/Clothing/OuterClothing/Armor/wizardplate.rsi
  - type: Clothing
    sprite: _Moffstation/Clothing/OuterClothing/Armor/wizardplate.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.5
        Slash: 0.5
        Piercing: 0.5
        Heat: 0.4
  - type: ExplosionResistance
    damageCoefficient: 0.6
  - type: StaminaResistance
    damageCoefficient: 0.65
  - type: ClothingSpeedModifier
    walkModifier: 0.8
    sprintModifier: 0.8

- type: entity
  parent: [ ClothingOuterArmorBase, BaseChameleon, BaseSyndicateContraband ]
  id: ClothingOuterArmorChameleon
  name: armored chameleon vest
  suffix: Chameleon, Armor
  description: A chameleon vest reinforced with flexible armor plating.
  components:
  - type: Sprite
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: Clothing
    sprite: Clothing/OuterClothing/Armor/security.rsi
  - type: ChameleonClothing
    slot: [ outerClothing ]
    default: ClothingOuterArmorBasic
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.7
        Slash: 0.7
        Piercing: 0.7
        Heat: 0.7
    showArmorOnExamine: true #Should maybe make false if chameleon? However wanted some sorta counterplay if caught.
  - type: StaminaResistance
    damageCoefficient: 0.75

# HoS
- type: entity
  parent: [ClothingOuterArmorBaseCarapace, ClothingOuterBase, BaseCommandContraband]
  id: ClothingOuterArmorHoSCarapace
  name: head of security's carapace
  description: A lightweight armored chestpiece that provides protection whilst still offering mobility and flexibility. Issued to only the station's most authoritative.
  components:
  - type: Sprite
    sprite: _Moffstation/Clothing/OuterClothing/Armor/hoscarapace.rsi
  - type: Clothing
    sprite: _Moffstation/Clothing/OuterClothing/Armor/hoscarapace.rsi
  - type: Armor
    modifiers:
      coefficients:
        Blunt: 0.65
        Slash: 0.65
        Piercing: 0.6
        Heat: 0.7
        Caustic: 0.75
